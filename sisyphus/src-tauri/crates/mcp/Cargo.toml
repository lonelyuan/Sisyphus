[package]
name = "sisyphus-mcp"
version = "0.1.0"
edition = "2021"
description = "Sisyphus 反思平面 MCP server（stdio），复用 sisyphus-core"

[[bin]]
name = "sisyphus-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
sisyphus-core = { path = "../core" }
