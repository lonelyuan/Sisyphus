[package]
name = "sisyphus-core"
version = "0.1.0"
edition = "2021"
description = "Sisyphus 唯一事实来源：Event log + Artifact store + ingest_event + 规则引擎"

[lib]
name = "sisyphus_core"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

